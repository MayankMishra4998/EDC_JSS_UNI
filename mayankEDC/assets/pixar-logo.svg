<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%" fill="currentColor">
  <!-- P -->
  <text x="20" y="85" font-family="'Times New Roman', Times, serif" font-weight="bold" font-size="82" letter-spacing="4">P</text>
  
  <!-- Luxo Jr. Desk Lamp replacing the 'I' -->
  <g transform="translate(100, 15) scale(0.75)">
    <!-- Base -->
    <ellipse cx="40" cy="100" rx="28" ry="8" fill="currentColor"/>
    <!-- Lower arm -->
    <path d="M40 98 L24 60 L30 58 L44 96 Z" fill="currentColor"/>
    <!-- Pivot joint -->
    <circle cx="27" cy="59" r="6" fill="currentColor"/>
    <!-- Upper arm -->
    <path d="M27 59 L55 28 L59 32 L31 63 Z" fill="currentColor"/>
    <!-- Lamp head cone -->
    <path d="M57 30 L80 12 L92 36 L68 40 Z" fill="currentColor"/>
    <!-- Light bulb glow -->
    <ellipse cx="86" cy="24" rx="8" ry="14" transform="rotate(-30 86 24)" fill="#ffd60a"/>
  </g>
  
  <!-- X A R -->
  <text x="180" y="85" font-family="'Times New Roman', Times, serif" font-weight="bold" font-size="82" letter-spacing="4">X A R</text>
  <text x="180" y="112" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="12" letter-spacing="7" opacity="0.75">ANIMATION STUDIOS</text>
</svg>
